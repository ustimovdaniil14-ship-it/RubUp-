<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>RubUp</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   RubUp — чёрно-белая тема (чистый чёрный, белые кнопки).
   Цвет есть только у результата: зелёный — победа, красный — проигрыш.
   Все цвета меняются в одном месте: переменные ниже.
   ========================================================================== */
:root{
  --bg:#000000;       /* фон */
  --c1:#0c0c0d;       /* карточки */
  --c2:#161617;       /* кнопки, поля */
  --c3:#232325;       /* трек, неактивное */
  --bd:#252526;       /* рамки */
  --bd2:#333336;      /* рамки на hover / поля */
  --tx:#f5f5f6;       /* основной текст (тёплый белый) */
  --mu:#8e8e93;       /* вторичный текст */
  --ink:#000000;      /* текст на светлых кнопках */
  --acc:#FFFFFF;      /* главные кнопки и выбранное */
  --hi:#F5F5F6;       /* акценты: деньги, ★, важные числа */
  --hi2:#FFFFFF;
  --fx:#FFFFFF;       /* фокус и активные поля */
  --ok:#35e0a0;
  --bad:#fa3156;
  --fd:"Unbounded","Arial Black","Segoe UI",system-ui,sans-serif;
  --fb:"Manrope",-apple-system,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r-l:22px;--r-m:16px;--r-s:12px;
  color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);min-height:100%;
  background:radial-gradient(520px 260px at 50% -130px,#ffffff12,transparent 72%),var(--bg) fixed}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0 auto;max-width:480px;padding:10px 14px calc(104px + env(safe-area-inset-bottom,0px));
  background:transparent;color:var(--tx);font:500 15px/1.4 var(--fb);-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;transition:transform .12s,background-color .15s,border-color .15s,opacity .15s}
button:active:not(:disabled){transform:scale(.97)}
:focus-visible{outline:2px solid var(--fx);outline-offset:2px}
h2{font-family:var(--fd);font-size:22px;font-weight:700;letter-spacing:-.02em;margin:14px 0 6px}
.mu{color:var(--mu)}
.gold{color:var(--tx)}
.up{color:var(--ok)}.dn{color:var(--bad)}

/* ---------- шапка ---------- */
.hd{display:flex;align-items:center;gap:8px;padding:6px 0 14px}
.brand{flex:1;min-width:0;line-height:1}
.wm{display:inline-flex;align-items:center;font-family:var(--fd);font-weight:800;font-size:24px;letter-spacing:-.035em;color:var(--tx);white-space:nowrap}
.wm svg{width:.62em;height:.62em;margin-left:.1em;flex:none}
.onl{display:flex;align-items:center;gap:5px;margin-top:6px;font-size:11.5px;font-weight:600;color:var(--mu);white-space:nowrap}
.onl .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);animation:pu 1.8s ease-in-out infinite}
@keyframes pu{50%{opacity:.35}}
.pill{display:flex;align-items:center;gap:6px;flex:none;height:44px;padding:0 5px 0 13px;border-radius:22px;background:var(--c1);border:1px solid var(--bd);font-weight:800}
.pill .st{color:var(--hi);font-size:15px}
.pill #bal{font-size:16px}
.plus{width:34px;height:34px;border-radius:50%;background:var(--acc);color:var(--ink);font-size:21px;font-weight:700;line-height:1;display:grid;place-items:center}
.hist{flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:var(--c1);border:1px solid var(--bd);color:var(--tx)}
.hist svg{width:20px;height:20px}

/* ---------- нижнее меню ---------- */
nav{position:fixed;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:452px;margin:0 auto;z-index:5;
  display:flex;gap:4px;padding:6px;border-radius:28px;background:#0c0c0dee;border:1px solid var(--bd);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 16px 36px -14px #000}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 7px;border-radius:22px;color:var(--mu);font-size:12px;font-weight:700}
nav button.on{background:var(--acc);color:var(--ink)}
nav svg{width:24px;height:24px}

/* ---------- базовые блоки ---------- */
.card{background:var(--c1);border:1px solid var(--bd);border-radius:var(--r-l);padding:18px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lbl{font-size:18px;font-weight:800;letter-spacing:-.01em}
.sec{margin:22px 2px 10px;font-size:14px;font-weight:700;color:var(--mu)}
.note{text-align:center;color:var(--mu);margin:12px 0 0;font-size:13px;line-height:1.4}
.sm{white-space:nowrap;padding:10px 14px;border-radius:var(--r-s);background:var(--c2);border:1px solid var(--bd2);font-weight:700;font-size:14px}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;border:1px dashed var(--bd2);border-radius:var(--r-l);padding:30px 20px;text-align:center;color:var(--mu);margin-top:12px}

/* поля ввода и кнопки */
.inp{display:flex;align-items:center;gap:8px;background:#060607;border:1px solid var(--bd2);border-radius:var(--r-m);padding:0 14px;margin:12px 0 10px}
.inp:focus-within{border-color:var(--fx)}
.inp input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font:inherit;font-size:20px;font-weight:700;padding:14px 0}
.inp input::placeholder{color:#5a5a60;font-weight:600}
.inp>span{color:var(--mu);font-weight:600;font-size:14px}
.inp .sm{padding:8px 12px;margin:6px -8px 6px 0}
.inp select{background:none;border:0;color:inherit;font:inherit;font-weight:600}
.inp.big{height:64px;padding:0 16px}
.inp.big i{font-style:normal;color:var(--hi);font-size:22px}
.inp.big input{font-size:26px;font-weight:800}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.chips button{padding:12px 0;border-radius:var(--r-s);background:var(--c2);border:1px solid var(--bd);font-weight:800;font-size:14.5px}
.chips button:active{border-color:var(--tx)}
.seg3{display:flex;gap:2px;padding:3px;border-radius:13px;background:#060607;border:1px solid var(--bd)}
.seg3 button{padding:8px 14px;border-radius:10px;font-weight:800;font-size:14px}
.seg3 button:active{background:var(--c3)}
.seg{display:flex;gap:4px;padding:4px;margin-bottom:12px;border-radius:var(--r-m);background:var(--c1);border:1px solid var(--bd);overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;white-space:nowrap;padding:10px 14px;border-radius:12px;font-weight:700;font-size:14px;color:var(--mu)}
.seg button.on{background:var(--acc);color:var(--ink)}
.xs{display:flex;gap:8px;overflow-x:auto;padding:12px 0 6px;scrollbar-width:none}
.xs::-webkit-scrollbar{display:none}
.xs button{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:72px;padding:10px 14px;border-radius:var(--r-m);background:var(--c2);border:1px solid var(--bd)}
.xs button b{font-size:17px;font-weight:800}
.xs button small{font-size:11px;font-weight:700;color:var(--mu)}
.xs button.on{background:var(--acc);border-color:var(--acc);color:var(--ink)}
.xs button.on small{color:#55555a}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;margin:14px 0 8px;border-radius:8px;background:var(--c3);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--acc);border:5px solid var(--bg);box-shadow:0 0 0 2px var(--acc)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--acc);border:5px solid var(--bg);box-shadow:0 0 0 2px var(--acc)}

.go{display:block;width:100%;margin-top:12px;padding:16px;border-radius:var(--r-m);background:var(--acc);color:var(--ink);font-size:18px;font-weight:800;line-height:1.2}
.go small{display:block;margin-top:2px;font-size:12.5px;font-weight:600;opacity:.6}
.go:disabled{background:var(--c2);color:#5a5a60;cursor:default}
.go.ghost{background:var(--c2);color:var(--tx);border:1px solid var(--bd2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.two button{padding:13px 10px;border-radius:var(--r-m);background:var(--c2);border:1px solid var(--bd2);font-weight:700;font-size:15px}
.two button.w{background:var(--acc);border-color:var(--acc);color:var(--ink)}

/* ---------- шторка и уведомления ---------- */
.sheet{position:fixed;inset:0;display:none;align-items:flex-end;background:#000000aa;z-index:9}
.sheet.show{display:flex}
.sheet>div{width:100%;max-width:480px;margin:0 auto;max-height:86vh;overflow-y:auto;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));
  background:var(--c1);border:1px solid var(--bd);border-bottom:0;border-radius:26px 26px 0 0;animation:sup .24s ease-out}
@keyframes sup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.hr{display:flex;justify-content:space-between;gap:10px;padding:12px 4px;border-bottom:1px solid var(--bd);font-weight:600}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-90px);z-index:20;max-width:90%;
  padding:12px 18px;border-radius:var(--r-m);background:var(--acc);color:var(--ink);font-weight:700;text-align:center;transition:.3s}
.toast.show{transform:translate(-50%,0)}
#view{animation:vin .24s ease-out}
@keyframes vin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- главная: бонус и список игр ---------- */
.hero{position:relative;display:flex;align-items:center;justify-content:space-between;width:100%;min-height:150px;overflow:hidden;
  padding:18px 0 18px 18px;border-radius:var(--r-l);text-align:left;color:var(--tx);
  background:linear-gradient(115deg,#1b1b1d,#0e0e0f 62%);border:1px solid var(--bd2)}
.hero-t{display:flex;flex-direction:column;align-items:flex-start;gap:5px;max-width:58%;z-index:1}
.hero-k{font-size:12.5px;font-weight:700;color:var(--hi)}
.hero-t b{font-family:var(--fd);font-size:20px;line-height:1.15;font-weight:700;letter-spacing:-.02em}
.hero-t small{font-size:12.5px;color:#a1a1a6;line-height:1.35}
.hero-b{margin-top:8px;padding:9px 14px;border-radius:var(--r-s);background:var(--acc);color:var(--ink);font-weight:800;font-size:13px}
.hero-b.off{background:#ffffff1c;color:var(--tx)}
.hero-w{position:absolute;right:-46px;top:50%;width:190px;height:190px;margin-top:-95px;animation:rt 50s linear infinite}
@keyframes rt{to{transform:rotate(360deg)}}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px}
.kp div{padding:11px 12px;border-radius:var(--r-m);background:var(--c1);border:1px solid var(--bd)}
.kp small{display:block;margin-bottom:3px;font-size:11.5px;color:var(--mu)}
.kp b{font-size:15px;font-weight:800}
.glist{display:flex;flex-direction:column;gap:10px}
.grow{position:relative;display:flex;align-items:center;justify-content:space-between;width:100%;min-height:96px;overflow:hidden;
  padding:14px 8px 14px 18px;border-radius:var(--r-l);text-align:left;background:var(--c1);border:1px solid var(--bd)}
.grow:active{border-color:var(--bd2)}
.gr-t{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0;max-width:60%}
.gr-t b{font-family:var(--fd);font-size:16px;font-weight:700;letter-spacing:-.02em}
.gr-t small{font-size:12.5px;color:var(--mu);line-height:1.35}
.gtag{margin-top:5px;padding:4px 9px;border-radius:8px;background:var(--c2);color:var(--hi);font-size:11.5px;font-weight:700}
.gr-art{width:108px;flex:none}.gr-art svg{display:block;width:100%}
.grow em{position:absolute;right:12px;top:10px;font-style:normal;font-size:11px;font-weight:800;color:var(--hi)}

/* ---------- экран игры ---------- */
.gh{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.gt{display:flex;align-items:center;gap:8px;font-family:var(--fd);font-size:19px;font-weight:700;letter-spacing:-.02em}
.gt svg{width:22px;height:22px;color:var(--hi)}
.gh .sm{display:grid;place-items:center;width:42px;height:42px;padding:0;border-radius:50%;font-size:0}
.gh .sm::before{content:"‹";font-size:30px;line-height:1;margin-top:-3px;color:var(--tx)}
.dcard{padding:22px 18px 18px;background:radial-gradient(120% 70% at 50% 0%,#1b1b1d,var(--c1) 70%)}
.dial{position:relative;width:100%;max-width:320px;margin:0 auto}
.dial svg{display:block;width:100%}
.tks line{stroke:var(--c3)}.tks line.w{stroke:var(--hi2)}
.ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.ctr b{font-size:44px;font-weight:800;letter-spacing:-.04em}
.ctr span{margin-top:2px;font-size:13px;font-weight:600;color:var(--mu)}
.ctr.ok b{color:var(--ok)}.ctr.bad b{color:var(--bad)}
.dstat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.dstat div{padding:12px 6px;border-radius:var(--r-m);text-align:center;background:#060607;border:1px solid var(--bd)}
.dstat small{display:block;margin-bottom:3px;font-size:11.5px;font-weight:600;color:var(--mu)}
.dstat b{font-size:16px;font-weight:800}
.dstat div:nth-child(3) b{color:var(--hi)}

/* переключатель */
.sw{position:relative;flex:none;width:50px;height:30px;border-radius:15px;background:var(--c3)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--mu);transition:transform .2s,background .2s}
.sw.on{background:var(--acc)}.sw.on::after{transform:translateX(20px);background:var(--ink)}

/* апгрейдер */
.uh{min-height:30px;align-items:center;margin:-2px 0 10px}
.uh b.w{color:var(--ok)}.uh b.l{color:var(--bad)}
.dial #arc{transition:stroke .3s}
.dial.res-ok #arc{stroke:var(--ok)}.dial.res-bad #arc{stroke:var(--bad)}
.xf{display:grid;grid-template-columns:48px 1fr 1fr 48px;gap:8px;margin:12px 0 4px}
.xstep{border-radius:var(--r-m);background:var(--c2);border:1px solid var(--bd2);font-size:24px;font-weight:700;line-height:1}
.xin{display:flex;align-items:center;gap:6px;min-width:0;padding:0 12px;border-radius:var(--r-m);background:#060607;border:1px solid var(--bd2)}
.xin:focus-within{border-color:var(--fx)}
.xin input{flex:1;min-width:0;width:100%;padding:12px 0;background:none;border:0;outline:0;color:var(--tx);font:inherit;font-size:19px;font-weight:800}
.xin span{color:var(--mu);font-weight:700}
.cta{position:sticky;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:4;margin:0 -14px;padding:16px 14px 8px;background:linear-gradient(180deg,transparent,var(--bg) 42%)}
.cta .go{margin:0}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}

/* мины и лесенка */
.mg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:6px 0 12px}
.mt{aspect-ratio:1;display:grid;place-items:center;border-radius:14px;background:var(--c2);border:1px solid var(--bd2);font-size:26px}
.mt:disabled{color:inherit;cursor:default}
.mt:not(:disabled):active{transform:scale(.92)}
.mt.g{background:#143a35;border-color:#2e7a63}
.mt.b{background:#2a1218;border-color:#7d2a3a}
.mt.g.new{animation:pp .35s}.mt.b.new{animation:bm2 .5s}.mt.dim{opacity:.4}
@keyframes pp{0%{transform:scale(.5) rotate(-20deg)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes bm2{0%{transform:scale(.4)}30%{transform:scale(1.35)}100%{transform:scale(1)}}
.lad{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.lr{display:flex;align-items:center;gap:8px}
.lm{flex:none;width:62px;text-align:right;font-weight:700;font-size:13px;color:var(--mu)}
.lr.cur .lm{color:var(--tx)}.lr.done .lm{color:var(--ok)}
.lcs{flex:1;display:grid;gap:6px}
.mt.lt{aspect-ratio:auto;height:46px;font-size:22px}
.lr.cur .mt.lt{border-color:var(--hi)}
.lr:not(.cur) .mt.lt:disabled:not(.g):not(.b){opacity:.55}

/* ракетка */
.chist{display:flex;gap:6px;overflow:hidden;margin-bottom:8px}
.chist b{flex:none;padding:5px 9px;border-radius:10px;border:1px solid var(--bd);font-size:13px}
.chist .hi{color:var(--ok)}.chist .lo{color:var(--mu)}
.sky{position:relative;height:260px;overflow:hidden;border-radius:var(--r-m);border:1px solid var(--bd);background:linear-gradient(180deg,#000000,#0e0e10 75%,#1a1a1c)}
.sky .stars{position:absolute;inset:0;opacity:.6;background-image:radial-gradient(#fff 1px,transparent 1.6px),radial-gradient(#8e8e93 1px,transparent 1.6px);background-size:46px 46px,77px 77px;background-position:0 0,20px 30px}
.sky.fly .stars{animation:st .7s linear infinite}
@keyframes st{to{background-position:-92px 92px,-134px 107px}}
.sky svg.tr{position:absolute;inset:0;width:100%;height:100%}
.rk{position:absolute;left:0;top:0;width:40px;height:54px;will-change:transform}.rk svg{display:block}
.flame{transform-origin:24px 46px;opacity:0}
.rk.on .flame{opacity:1;animation:fk .12s infinite alternate}
@keyframes fk{to{transform:scaleY(1.5) scaleX(.85)}}
.cm{position:absolute;left:0;right:0;top:12px;text-align:center;font-family:var(--fd);font-size:44px;font-weight:800;letter-spacing:-.04em}
.cs{position:absolute;left:0;right:0;top:72px;text-align:center;font-size:14px;font-weight:600;color:var(--fx)}
.sky.bm{animation:shk .4s}.sky.bm .cm{color:var(--bad)}
@keyframes shk{20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-4px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,3px)}}
.boom{position:absolute;left:-22px;top:-14px;font-size:84px;animation:bx .7s ease-out forwards}
@keyframes bx{0%{transform:scale(.2);opacity:1}100%{transform:scale(2);opacity:0}}

/* ---------- колесо ---------- */
.wheel{width:100%;max-width:310px;margin:10px auto 6px}
.wheel svg{display:block;width:100%;overflow:visible}
.led{fill:var(--tx);animation:ledb 1s steps(1) infinite}.led.l1{animation-delay:-.5s}
@keyframes ledb{0%{opacity:1}50%{opacity:.25}}
.wheel.spin .led{animation-duration:.2s}
.wptr{transform-box:fill-box;transform-origin:50% 8%}
.wheel.spin .wptr{animation:ptk .16s ease-in-out infinite}
@keyframes ptk{50%{transform:rotate(-9deg)}}
.wres{min-height:26px;margin:4px 0 10px;text-align:center;font-size:16px}
.wres b{color:var(--hi)}
.cf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:99999}
.cf i{position:absolute;top:-16px;width:8px;height:14px;border-radius:2px;animation:cfall linear forwards}
@keyframes cfall{to{transform:translate(var(--dx),110vh) rotate(720deg)}}

/* ---------- топ ---------- */
.pg-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 6px}
.pg-h h2{margin:0}
.pg-h .seg{margin:0;padding:3px;border-radius:12px}
.pg-h .seg button{padding:7px 12px;font-size:13px;border-radius:9px}
.pg-s{margin:0 2px 14px;font-size:13px}
.podium{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:8px;align-items:end;margin:6px 0 16px}
.pc{display:flex;flex-direction:column;align-items:center;min-width:0;text-align:center}
.pc b{max-width:100%;margin-top:7px;font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc span{min-height:16px;font-size:12px;color:var(--mu)}
.pav{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--c2);border:2px solid var(--bd2);font-size:20px;font-weight:800}
.pc.p1 .pav{width:64px;height:64px;font-size:24px;border-color:var(--hi)}

function dialSvg(p,ch,a){let tk='';const zs=180-ch*180;for(let i=0;i<60;i++){const d=i*6,r=d*Math.PI/180,w=(((d-zs)%360+360)%360)<ch*360-.01;tk+=`<line class="${w?'w':''}" x1="${(150+128*Math.sin(r)).toFixed(2)}" y1="${(150-128*Math.cos(r)).toFixed(2)}" x2="${(150+138*Math.sin(r)).toFixed(2)}" y2="${(150-138*Math.cos(r)).toFixed(2)}"/>`}
 return `<svg viewBox="0 0 300 300"><defs><linearGradient id="${p}gw" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#8e8e93"/><stop offset="1" stop-color="#ffffff"/></linearGradient><radialGradient id="${p}gi" cx="50%" cy="38%" r="75%"><stop offset="0" stop-color="#161617"/><stop offset="1" stop-color="#000000"/></radialGradient></defs>
 <g class="tks" id="${p}tk" stroke-width="3.5" stroke-linecap="round">${tk}</g>
 <circle cx="150" cy="150" r="${R}" fill="none" stroke="#232325" stroke-width="16"/>
 <circle id="${p}arc" cx="150" cy="150" r="${R}" fill="none" stroke="url(#${p}gw)" stroke-width="16" transform="rotate(${90-ch*180} 150 150)" stroke-dasharray="${ch*CI} ${CI}"/>
 <circle cx="150" cy="150" r="90" fill="url(#${p}gi)" stroke="#252526" stroke-width="1.5"/>
 <circle cx="150" cy="150" r="78" fill="none" stroke="#333336" stroke-width="1" stroke-dasharray="2 6"/>
 <line x1="150" y1="255" x2="150" y2="280" stroke="#f5f5f6" stroke-opacity=".6" stroke-width="2" stroke-linecap="round"/>
 <g id="${p}ptr" style="transform-origin:150px 150px;transform:rotate(${a}deg)"><path d="M133 8h34l-17 30z" fill="#f5f5f6" stroke="#000000" stroke-width="3" stroke-linejoin="round"/></g></svg>`}
const chipsB=f=>[[10,'10'],[50,'50'],[100,'100'],[500,'500'],[1000,'1k'],[5000,'5k'],[10000,'10k'],[50000,'50k']].map(([v,l])=>`<button onclick="${f}(${v})">${l}</button>`).join('');

 $('view').innerHTML=`${tabs('up')}

 <div class="card"><div class="row"><span class="lbl">Ставка</span><span class="seg3"><button onclick="setBet(Math.floor(bet/2))">½</button><button onclick="setBet(bet*2)">×2</button><button onclick="setBet(maxBet())">MAX</button></span></div>

  <div class="xf"><button class="xstep" onclick="stepX(-1)" aria-label="Меньше">−</button>
   <label class="xin"><input id="xi" type="number" inputmode="decimal" step="0.01" aria-label="Множитель" oninput="setX(this.value,'x')" onchange="setX(X)"><span>x</span></label>
   <label class="xin"><input id="ci" type="number" inputmode="decimal" step="0.01" aria-label="Шанс, %" oninput="setC(+this.value)" onchange="setX(X)"><span>%</span></label>
   <button class="xstep" onclick="stepX(1)" aria-label="Больше">+</button></div>
  <div class="xs" id="xs">${UPX().map(x=>`<button data-x="${x}" onclick="setX(${x})"><b>${x}x</b><small>${(E/x*100).toFixed(x>=10?0:1)}%</small></button>`).join('')}</div>

 setBet(bet,0);setX(X);ctr()}
function setBet(v,fromInput){bet=Math.max(0,Math.min(Math.floor(v)||0,maxBet()));const b=$('bi');if(b&&!(fromInput&&bet==v))b.value=bet||'';upd()}
const UPX=()=>{const a=[UPMINX,2,3,5,10,25,50,UPMAX].filter(x=>x>=UPMINX-1e-9&&x<=UPMAX+1e-9);return a.filter((x,i)=>a.indexOf(x)==i)};
const slX=v=>UPMINX*Math.pow(UPMAX/UPMINX,v/1000),xSl=x=>Math.round(Math.log(x/UPMINX)/Math.log(UPMAX/UPMINX)*1000);
function setX(x,src){x=+x;if(!isFinite(x)||x<=0)return;X=Math.min(UPMAX,Math.max(UPMINX,Math.round(x*100)/100));upd(src)}
function setC(p){if(p>0)setX(E/(p/100),'c')}
function stepX(d){const s=xStep(X);setX(+(Math.round((X+d*s)/s)*s).toFixed(2))}
function goBtn(){const g=$('go');if(!g)return;const low=bet>S.bal;g.disabled=busy||!(bet>=1)||low;
 g.innerHTML=low?`Недостаточно звёзд<small>баланс ${fmt(S.bal)} ★</small>`:bet>=1?`Апгрейдить<small>ставка ${fmt(bet)} ★ · выигрыш ${fmt(Math.floor(bet*X))} ★</small>`:'Апгрейдить<small>укажите сумму ставки</small>';
 const u=$('ubal');if(u)u.textContent='баланс '+fmt(S.bal)}
function upd(src){if(page!='games'||game!='up'||!$('arc'))return;const ch=E/X;$('arc').setAttribute('stroke-dasharray',`${ch*CI} ${CI}`);$('arc').setAttribute('transform',`rotate(${90-ch*180} 150 150)`);
 document.querySelectorAll('#tk line').forEach((l,i)=>l.classList.toggle('w',(((i*6-(180-ch*180))%360+360)%360)<ch*360-.01));
 $('chl').textContent=(ch*100).toFixed(2)+'% шанс';$('ds1').textContent=(ch*100).toFixed(2)+'%';$('ds2').textContent=X.toFixed(2)+'x';$('ds3').textContent=fmt(Math.floor(bet*X))+' ★';
 if(src!='x')$('xi').value=X.toFixed(2);if(src!='c')$('ci').value=(ch*100).toFixed(2);
 document.querySelectorAll('#xs button').forEach(b=>b.classList.toggle('on',+b.dataset.x==X));$('sl').value=xSl(X);
 goBtn();if(!busy)ctr()}
function ctr(c,t,s){const e=$('ctr');if(!e)return;e.className='ctr '+(c||'');e.innerHTML=`<b>${t||X.toFixed(2)+'x'}</b><span>${s||'шанс: '+(E/X*100).toFixed(2)+'%'}</span>`}
async function play(){
 if(busy||!(bet>=1)||bet>S.bal)return;busy=true;const b=bet,x=X,ch=E/x;
 const dl=$('dial');if(dl)dl.classList.remove('res-ok','res-bad');goBtn();ctr('','…','крутим');
 const d=await api('up',{bet:b,x:x});if(d.error){busy=false;toast(d.error);upd();return}
 S.bal-=b;S.wag+=b;S.ups++;setBal();
 const r=d.r,win=d.win,p=$('ptr');
 if(p){const a0=ang;ang=(Math.floor(ang/360)+6)*360+180+(r-ch/2)*360;spinTo(p,a0,ang)}
 await wait(Math.round(SD()*1000)+450);hapN(win?'success':'error');SFX.res(win);
 const pay=d.pay;if(win){S.wins++;S.best=Math.max(S.best,pay)}
 S.bal=d.balance;S.hist.unshift({b,x,win,pay,r:r*100,t:Date.now()});S.hist=S.hist.slice(0,40);setBal();
 const d2=$('dial');if(d2)d2.classList.add(win?'res-ok':'res-bad');const uh=$('uh');if(uh)uh.innerHTML=uHistHtml();
 if($('ctr'))ctr(win?'ok':'bad',win?'+'+fmt(pay):'−'+fmt(b),`ролл ${(r*100).toFixed(2)}% ${win?'<':'≥'} ${(ch*100).toFixed(2)}%`);
 busy=false;goBtn();
 await wait(2400);if(page=='games'&&game=='up'&&!busy){const d3=$('dial');if(d3)d3.classList.remove('res-ok','res-bad');ctr();upd()}}

   cells+=`<button class="${cl}" ${a&&r==n?`onclick="lPick(${i})"`:'disabled'}>${h}</button>`}
