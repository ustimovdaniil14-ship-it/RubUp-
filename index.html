<style>
/* RubUp — редизайн. Палитра прежняя: чёрный фон, белые кнопки, зелёный/красный только для результата, золото только для денег в апгрейдере. */
:root{--bg:#000;--c1:#212439;--c2:#2a2d47;--c3:#34375a;--bd:#2c2f4a;--bd2:#3a3d63;--tx:#f5f5f6;--mu:#9a9db8;--ink:#000;--acc:#fff;--hi:#f5f5f6;--hi2:#fff;--fx:#fff;--ok:#35e0a0;--bad:#fa3156;--gold:#f5c542;
--fd:"Unbounded","Arial Black","Segoe UI",system-ui,sans-serif;--fb:"Manrope",-apple-system,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;
--r-l:22px;--r-m:16px;--r-s:12px;--nav:86px;--sb:env(safe-area-inset-bottom,0px);--pad:14px;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{min-height:100%;overflow-x:hidden;scroll-padding-top:env(safe-area-inset-top,0px);background:radial-gradient(520px 240px at 50% -120px,#ffffff12,transparent 72%),var(--bg) fixed}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0 auto;max-width:480px;min-width:0;padding:0 var(--pad) calc(var(--nav) + 28px + var(--sb));color:var(--tx);font:500 15px/1.4 var(--fb);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body *{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;transition:transform .12s,background-color .15s,border-color .15s,opacity .15s}
button:active:not(:disabled){transform:scale(.97)}
:focus-visible{outline:2px solid var(--fx);outline-offset:2px}
h2{margin:18px 0 6px;font:700 21px var(--fd);letter-spacing:-.02em}
.mu{color:var(--mu)}.gold{color:var(--tx)}.up{color:var(--ok)}.dn{color:var(--bad)}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}

/* ===== шапка: лого слева, баланс справа ===== */

/* ===== нижняя навигация ===== */

/* ===== общие блоки ===== */
.card{margin:0 0 12px;padding:16px;border-radius:var(--r-l);background:var(--c1);border:1px solid var(--bd)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lbl{font-size:16px;font-weight:800;letter-spacing:-.01em}
.sec{margin:24px 2px 10px;font:700 15px var(--fd);letter-spacing:-.01em}
.note{margin:12px 0 0;text-align:center;color:var(--mu);font-size:13px;line-height:1.4}
.sm{white-space:nowrap;padding:9px 14px;border-radius:var(--r-s);background:var(--c2);border:1px solid var(--bd2);font-weight:700;font-size:14px}
.inp{display:flex;align-items:center;gap:8px;margin:10px 0;padding:0 14px;border-radius:var(--r-m);background:#171a2b;border:1px solid var(--bd2)}
.inp:focus-within{border-color:var(--fx)}
.inp input{flex:1;min-width:0;padding:13px 0;background:none;border:0;outline:0;color:var(--tx);font:700 19px var(--fb)}
.inp input::placeholder{color:#6f7296;font-weight:600}
.inp>span{color:var(--mu);font-weight:600;font-size:14px}
.inp .sm{margin:6px -8px 6px 0}
.inp select{background:none;border:0;color:inherit;font:inherit;font-weight:600}
.inp.big{height:56px;padding:0 16px}.inp.big i{font-style:normal;color:var(--gold);font-size:20px}.inp.big input{font-size:24px;font-weight:800}
.chips{display:flex;gap:8px;margin:10px 0 0;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:1 0 auto;min-width:58px;padding:11px 12px;border-radius:var(--r-s);background:var(--c2);border:1px solid var(--bd);font-weight:800;font-size:14px}
.chips button:active,.chips button.on{border-color:var(--tx)}.chips button.on{background:var(--acc);color:var(--ink)}
.seg3{display:flex;gap:2px;padding:3px;border-radius:13px;background:#171a2b;border:1px solid var(--bd)}
.seg3 button{padding:8px 13px;border-radius:10px;font-weight:800;font-size:14px}.seg3 button:active{background:var(--c3)}
.seg{display:flex;gap:4px;padding:4px;margin:0 0 12px;border-radius:var(--r-m);background:var(--c1);border:1px solid var(--bd);overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;white-space:nowrap;padding:9px 14px;border-radius:12px;font-weight:700;font-size:14px;color:var(--mu)}
.seg button.on{background:var(--acc);color:var(--ink)}
.xs{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.xs::-webkit-scrollbar{display:none}
.xs button{flex:1 0 auto;min-width:52px;padding:11px 14px;border-radius:var(--r-s);background:var(--c2);border:1px solid var(--bd);font-weight:800;font-size:16px}
.xs button.on{background:var(--acc);border-color:var(--acc);color:var(--ink)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;margin:0;border-radius:8px;background:var(--c3);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--acc);border:5px solid var(--bg);box-shadow:0 0 0 2px var(--acc)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--acc);border:5px solid var(--bg);box-shadow:0 0 0 2px var(--acc)}
.go{display:block;width:100%;margin-top:12px;padding:15px;border-radius:var(--r-m);background:var(--acc);color:var(--ink);font-size:17px;font-weight:800;line-height:1.2}
.go small{display:block;margin-top:2px;font-size:12px;font-weight:600;opacity:.6}
.go:disabled{background:var(--c2);color:#6f7296;cursor:default}
.go.ghost{background:var(--c2);color:var(--tx);border:1px solid var(--bd2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.two button{padding:13px 10px;border-radius:var(--r-m);background:var(--c2);border:1px solid var(--bd2);font-weight:700;font-size:15px}
.two button.w{background:var(--acc);border-color:var(--acc);color:var(--ink)}
.sw{position:relative;flex:none;width:50px;height:30px;border-radius:15px;background:var(--c3)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--mu);transition:transform .2s,background .2s}
.sw.on{background:var(--acc)}.sw.on::after{transform:translateX(20px);background:var(--ink)}

/* ===== шторка (sheet) и уведомления ===== */
.sheet{position:fixed;inset:0;z-index:9;display:none;align-items:flex-end;background:#000000b3}
.sheet.show{display:flex}
.sheet>div{position:relative;width:100%;max-width:480px;margin:0 auto;max-height:88vh;overflow-y:auto;padding:26px 16px calc(20px + var(--sb));background:var(--c1);border:1px solid var(--bd2);border-bottom:0;border-radius:26px 26px 0 0;animation:sup .24s ease-out}
.sheet>div::before{content:"";position:absolute;top:9px;left:50%;width:38px;height:4px;margin-left:-19px;border-radius:4px;background:var(--c3)}
@keyframes sup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{margin:2px 0 8px}
.hr{display:flex;justify-content:space-between;gap:10px;padding:13px 2px;border-bottom:1px solid var(--bd);font-weight:600}
.hr:last-child{border-bottom:0}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));z-index:20;max-width:90%;padding:12px 18px;border-radius:var(--r-m);background:var(--acc);color:var(--ink);font-weight:700;text-align:center;transform:translate(-50%,-90px);transition:.3s}
.toast.show{transform:translate(-50%,0)}
#view{padding-top:6px;animation:vin .24s ease-out}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ===== главная: бонус-лента и список игр ===== */

/* ===== экран игры ===== */
.gh{display:flex;align-items:center;gap:12px;margin:6px 0 14px}
.gh .sm{display:grid;place-items:center;width:40px;height:40px;padding:0;border-radius:50%;font-size:0}
.gh .sm::before{content:"‹";margin-top:-3px;color:var(--tx);font-size:30px;line-height:1}
.gt{display:flex;align-items:center;gap:8px;font:700 18px var(--fd);letter-spacing:-.02em}
.gt svg{width:22px;height:22px}
.dcard{padding:14px 8px 16px;background:radial-gradient(120% 70% at 50% 0%,#2a2d47,var(--c1) 70%)}
.dial{position:relative;width:100%;max-width:360px;margin:0 auto}
.dial svg{display:block;width:100%}
.tks line{stroke:var(--c3)}.tks line.w{stroke:var(--hi2)}.tks line.hot{stroke:var(--gold)!important;stroke-width:6}
.dial #arc{transition:stroke .3s;filter:drop-shadow(0 0 7px #ffffff44)}
.dial.res-ok #arc{stroke:var(--ok);filter:drop-shadow(0 0 9px var(--ok))}
.dial.res-bad #arc{stroke:var(--bad);filter:drop-shadow(0 0 9px var(--bad))}
.dial.spin{filter:drop-shadow(0 0 14px #ffffff18)}.dial.spin #pk path{filter:drop-shadow(0 0 6px #fffc)}
.dial.land{animation:lnd .5s ease}@keyframes lnd{35%{transform:scale(1.035)}}
.ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 22%;text-align:center;pointer-events:none}
.ctr b{font:800 clamp(34px,11vw,50px)/1.05 var(--fd);letter-spacing:-.04em}
.ctr span{margin-top:4px;font-size:12.5px;font-weight:600;color:var(--mu)}
.ctr.ok b{color:var(--ok)}.ctr.bad b{color:var(--bad)}
.chn{margin-top:2px;text-align:center;color:var(--mu);font-size:14px;font-weight:700}
.chn b{margin-left:8px;color:var(--tx);font:700 22px var(--fd)}
.chist{display:flex;gap:6px;overflow:hidden;margin:0 0 10px}
.chist b{flex:none;padding:5px 9px;border-radius:10px;border:1px solid var(--bd);font-size:13px}
.chist .hi,.chist .w{color:var(--ok)}.chist .lo{color:var(--mu)}.chist .l{color:var(--bad)}
.uh{min-height:30px;align-items:center}

/* апгрейдер: пара «ставка → выигрыш», быстрый множитель, слайдер и нижняя кнопка */
.ubox{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.ub{min-width:0;padding:12px 14px;border-radius:18px;background:var(--c1);border:1px solid var(--bd)}
.ub small{display:block;color:var(--mu);font-size:12px;font-weight:600}
.ubi,.ubo{display:flex;align-items:center;gap:6px;margin:6px 0 4px;min-width:0;font:700 18px var(--fd)}
.ubi i,.ubo i{font-style:normal;color:var(--gold);font-size:16px}
.ubi b,.ubo b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uar{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--c2);border:3px solid var(--bg);font-weight:800}
.xq{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.xq button{padding:12px 0;border-radius:var(--r-s);background:var(--c2);border:1px solid var(--bd);font-weight:800;font-size:16px}
.xq button.on{background:var(--acc);color:var(--ink);border-color:var(--acc)}
.mrow{display:flex;gap:8px}
.mp,.cp{display:flex;align-items:center;gap:6px;flex:1;min-width:0;height:46px;padding:0 14px;border-radius:999px;font-weight:800}
.mp{background:var(--gold);color:#000;font-size:18px}
.cp{background:var(--c2);border:1px solid var(--bd2);color:var(--mu);font-size:14px;white-space:nowrap}
.mp input,.cp input{width:100%;min-width:0;background:none;border:0;outline:0;font:inherit;font-weight:800}
.mp input{color:#000}.cp input{color:var(--tx);font-size:17px}
.srow{display:flex;align-items:center;gap:10px;margin:12px 0 6px}
.xstep{flex:none;width:44px;height:44px;border-radius:50%;background:var(--c2);border:1px solid var(--bd2);font-size:22px;font-weight:700;line-height:1}
.srow input{flex:1;margin:0;background:linear-gradient(90deg,var(--gold) var(--p,0%),var(--c3) var(--p,0%))}
.cta{position:sticky;bottom:calc(var(--nav) + var(--sb));z-index:4;margin:0 calc(var(--pad)*-1);padding:14px var(--pad) 10px;background:linear-gradient(180deg,transparent,var(--bg) 38%)}
.cta .go{margin:0}
.ulock .ubox,.ulock .xq,.ulock .mrow,.ulock .srow{pointer-events:none;opacity:.5}

/* нижний блок управления ставкой в остальных играх (последняя карточка экрана) */
#view>.card:last-child{margin-top:4px;background:var(--c1);border-color:var(--bd2)}
#view>.card.ns:last-child{position:static!important;box-shadow:none!important}
@media (min-height:780px){#view>.card:last-child{position:sticky;bottom:calc(var(--nav) + var(--sb) + 8px);z-index:4;box-shadow:0 -16px 28px -12px #000}}

/* мины и лесенка */
.mg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:6px 0 12px}
.mt{display:grid;place-items:center;aspect-ratio:1;border-radius:14px;background:var(--c2);border:1px solid var(--bd2);font-size:26px}
.mt:disabled{color:inherit;cursor:default}.mt:not(:disabled):active{transform:scale(.92)}
.mt.g{background:#143a35;border-color:#2e7a63}.mt.b{background:#2a1218;border-color:#7d2a3a}.mt.dim{opacity:.4}
.mt.g.new{animation:pp .35s}.mt.b.new{animation:bm2 .5s}
@keyframes pp{0%{transform:scale(.5) rotate(-20deg)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes bm2{0%{transform:scale(.4)}30%{transform:scale(1.35)}100%{transform:scale(1)}}
.lad{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.lr{display:flex;align-items:center;gap:8px}
.lm{flex:none;width:60px;text-align:right;font-weight:700;font-size:13px;color:var(--mu)}
.lr.cur .lm{color:var(--tx)}.lr.done .lm{color:var(--ok)}
.lcs{flex:1;display:grid;gap:6px;min-width:0}
.mt.lt{aspect-ratio:auto;height:44px;font-size:22px}
.lr.cur .mt.lt{border-color:var(--tx)}
.lr:not(.cur) .mt.lt:disabled:not(.g):not(.b){opacity:.55}

/* ракетка */
.sky{position:relative;height:280px;overflow:hidden;border-radius:var(--r-m);border:1px solid var(--bd);background:linear-gradient(180deg,#000,#1a1d2e 75%,#25283f)}
.sky .stars{position:absolute;inset:0;opacity:.6;background-image:radial-gradient(#fff 1px,transparent 1.6px),radial-gradient(#9a9db8 1px,transparent 1.6px);background-size:46px 46px,77px 77px;background-position:0 0,20px 30px}
.sky.fly .stars{animation:st .7s linear infinite}
@keyframes st{to{background-position:-92px 92px,-134px 107px}}
.sky svg.tr{position:absolute;inset:0;width:100%;height:100%}
.rk{position:absolute;left:0;top:0;width:40px;height:54px;will-change:transform}.rk svg{display:block}
.flame{transform-origin:24px 46px;opacity:0}.rk.on .flame{opacity:1;animation:fk .12s infinite alternate}
@keyframes fk{to{transform:scaleY(1.5) scaleX(.85)}}
.cm{position:absolute;left:0;right:0;top:14px;text-align:center;font:800 44px var(--fd);letter-spacing:-.04em}
.cs{position:absolute;left:12px;right:12px;top:74px;text-align:center;font-size:14px;font-weight:600}
.sky.bm{animation:shk .4s}.sky.bm .cm{color:var(--bad)}
@keyframes shk{20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-4px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,3px)}}
.boom{position:absolute;left:-22px;top:-14px;font-size:84px;animation:bx .7s ease-out forwards}
@keyframes bx{0%{transform:scale(.2);opacity:1}100%{transform:scale(2);opacity:0}}

/* колесо удачи */
.wheel{width:100%;max-width:300px;margin:10px auto 6px}.wheel svg{display:block;width:100%;overflow:visible}
.led{fill:var(--tx);animation:ledb 1s steps(1) infinite}.led.l1{animation-delay:-.5s}
@keyframes ledb{0%{opacity:1}50%{opacity:.25}}
.wheel.spin .led{animation-duration:.2s}
.wptr{transform-box:fill-box;transform-origin:50% 8%}
.wheel.spin .wptr{animation:ptk .16s ease-in-out infinite}
@keyframes ptk{50%{transform:rotate(-9deg)}}
.wres{min-height:26px;margin:4px 0 8px;text-align:center;font-size:16px}
.cf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:99999}
.cf i{position:absolute;top:-16px;width:8px;height:14px;border-radius:2px;animation:cfall linear forwards}
@keyframes cfall{to{transform:translate(var(--dx),110vh) rotate(720deg)}}

/* ===== топ: подиум и список ===== */
.pg-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 4px}
.pg-h h2{margin:0}
.pg-h .seg{margin:0;padding:3px;border-radius:12px}.pg-h .seg button{padding:7px 12px;font-size:13px;border-radius:9px}
.pg-s{margin:0 2px 16px;font-size:13px}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end;margin:6px 0 16px;padding:16px 10px 0;border-radius:var(--r-l);background:radial-gradient(100% 80% at 50% 0%,#2a2d47,var(--c1));border:1px solid var(--bd);overflow:hidden}
.pc{display:flex;flex-direction:column;align-items:center;min-width:0;text-align:center}
.pc b{max-width:100%;margin-top:7px;font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc span{min-height:16px;font-size:12px;color:var(--mu);white-space:nowrap}
.pav{display:grid;place-items:center;width:50px;height:50px;border-radius:50%;background:var(--c2);border:2px solid var(--bd2);font-size:19px;font-weight:800}
.pc.p1 .pav{width:62px;height:62px;font-size:23px;border-color:var(--tx)}
.pc.p2 .pav{border-color:#c4c7e0}.pc.p3 .pav{border-color:#9a9db8}
.pbar{display:grid;place-items:start center;width:100%;margin-top:10px;padding-top:8px;border-radius:12px 12px 0 0;background:var(--c2);color:var(--mu);font:800 19px var(--fd)}
.pc.p1 .pbar{background:var(--acc);color:var(--ink)}
.rklist{display:flex;flex-direction:column;gap:6px}
.rr{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-m);background:var(--c1);border:1px solid var(--bd)}
.rr i{width:22px;text-align:center;font-style:normal;font-weight:700;color:var(--mu)}
.rav{display:grid;place-items:center;flex:none;width:32px;height:32px;border-radius:50%;background:var(--c2);font-size:13px;font-weight:700}
.rr b{flex:1;min-width:0;font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rr s{text-decoration:none;color:var(--mu);font-size:13.5px;font-weight:600;white-space:nowrap}
.rr.me{margin-top:12px;border-color:var(--bd2);background:var(--c2)}.rr.me s{color:var(--tx)}

/* ===== профиль ===== */
.pf-h{display:flex;align-items:center;gap:14px;margin:10px 0 14px}
.av{display:grid;place-items:center;flex:none;width:60px;height:60px;border-radius:50%;background:var(--acc);color:var(--ink);font:700 23px var(--fd)}
.pf-n{min-width:0}.pf-n h2{margin:0;font-size:19px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.idc{display:inline-flex;align-items:center;gap:6px;margin-top:4px;padding:4px 10px;border-radius:10px;background:var(--c1);border:1px solid var(--bd);color:var(--mu);font-size:12.5px}
.idc svg,.bal-b svg,.promo>svg{width:18px;height:18px;flex:none}
.bal-c{padding:18px;border-radius:var(--r-l);background:linear-gradient(135deg,#2a2d47,#1a1d2e 70%);border:1px solid var(--bd2)}
.bal-c small,.stg small{display:block;color:var(--mu);font-size:12.5px}
.bal-c b{display:block;margin:4px 0 14px;font:800 32px var(--fd);letter-spacing:-.03em;overflow:hidden;text-overflow:ellipsis}
.bal-b{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bal-b button{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 8px;border-radius:var(--r-m);background:#ffffff14;border:1px solid #ffffff1f;font-weight:700}
.bal-b button.w{background:var(--acc);border-color:var(--acc);color:var(--ink)}
.stg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.stg div{min-width:0;padding:14px;border-radius:var(--r-m);background:var(--c1);border:1px solid var(--bd)}
.stg svg{display:block;width:20px;height:20px;margin-bottom:8px;color:var(--mu)}
.stg b{display:block;font-size:18px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.promo{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:var(--r-m);background:var(--c1);border:1px solid var(--bd);color:var(--mu)}
.promo input{flex:1;min-width:0;padding:8px 0;background:transparent;border:0;outline:0;color:var(--tx);font:inherit;font-size:15px}
.promo button{padding:10px 12px;border-radius:var(--r-s);background:var(--acc);color:var(--ink);font-weight:800;font-size:14px}
#view .chips[style*="grid-template-columns"]{display:flex!important;flex-direction:column;gap:0;margin-top:14px!important;overflow:hidden;border-radius:var(--r-l);background:var(--c1);border:1px solid var(--bd)}
#view .chips[style*="grid-template-columns"] button{display:flex;align-items:center;justify-content:space-between;width:100%;padding:15px 16px;border:0;border-radius:0;background:none;font-size:15px;font-weight:700;text-align:left}
#view .chips[style*="grid-template-columns"] button+button{border-top:1px solid var(--bd)}
#view .chips[style*="grid-template-columns"] button::after{content:"›";color:var(--mu);font-size:22px;line-height:1}

/* ===== админ-панель ===== */
.ah{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ac{min-width:0;padding:12px 14px;border-radius:var(--r-m);background:#171a2b;border:1px solid var(--bd)}
.ac small{display:block;margin-bottom:3px;font-size:12px;color:var(--mu)}.ac b{font-size:16px;font-weight:800}
.alist{display:flex;flex-direction:column;overflow:hidden;border-radius:var(--r-m);background:#171a2b;border:1px solid var(--bd)}
.ar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;font-size:14px}
.ar+.ar{border-top:1px solid var(--bd)}.ar span{min-width:0;overflow:hidden;text-overflow:ellipsis}.ar .sm{padding:7px 12px}
.acard{margin:12px 0 0;background:#171a2b}
.ah2{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-bottom:6px}.ah2 b{font-size:17px}
.tag{padding:3px 9px;border-radius:8px;background:var(--c2);font-style:normal;font-size:12px;font-weight:700}.tag.bad{color:var(--bad)}
.hint{margin:2px 0 10px;font-size:13px;line-height:1.45}
#au textarea,#am textarea{width:100%;min-height:96px;padding:12px;border-radius:var(--r-m);background:#171a2b;border:1px solid var(--bd2);color:var(--tx);font:inherit}

/* ===== экран загрузки ===== */
#launch{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;overflow:auto;background:radial-gradient(640px 360px at 50% -60px,#ffffff14,transparent 70%),var(--bg);transition:opacity .45s,transform .45s}
#launch.hide{opacity:0;transform:scale(1.04);pointer-events:none}
.lc{width:100%;max-width:420px;text-align:center}
.lword{font-size:52px;line-height:1}.lword svg{animation:rise 1.5s ease-in-out infinite}
@keyframes rise{0%,100%{transform:translateY(.06em)}50%{transform:translateY(-.12em)}}
.lbar{width:200px;height:4px;margin:26px auto 14px;border-radius:4px;background:var(--c3);overflow:hidden}
.lbar span{display:block;width:0;height:100%;border-radius:4px;background:var(--hi);transition:width .35s ease-out}
.lsub{color:var(--mu);font-weight:600;font-size:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wm,.lword{display:inline-flex;align-items:center;font-family:var(--fd);font-weight:800;letter-spacing:-.035em;white-space:nowrap}
.wm svg,.lword svg{width:.62em;height:.62em;margin-left:.1em;flex:none}

/* ===== ШАПКА: логотип и баланс сверху, онлайн и инструменты строкой ниже ===== */

/* ===== ПЛАВАЮЩИЙ ДОК ===== */

/* ===== ПРОМО-БАННЕР ===== */
.banner{position:relative;display:flex;align-items:center;width:100%;min-height:136px;margin-top:8px;padding:16px 0 16px 18px;overflow:hidden;text-align:left;color:var(--tx);border-radius:26px;background:radial-gradient(80% 120% at 100% 50%,#f5c54233,transparent 62%),linear-gradient(120deg,#2a2d47,#1d2035 70%);border:1px solid #f5c54233;box-shadow:inset 0 1px 0 #ffffff22,0 18px 36px -22px #000}
.hero-w{position:absolute;right:-40px;top:50%;width:176px;height:176px;margin-top:-88px;filter:drop-shadow(0 0 16px #f5c54233);animation:rt 50s linear infinite}
@keyframes rt{to{transform:rotate(360deg)}}
.bn-t{position:relative;z-index:1;display:flex;flex-direction:column;align-items:flex-start;gap:4px;max-width:60%}
.bn-k{font-size:12.5px;font-weight:800;color:var(--gold)}
.bn-t b{font:700 20px/1.12 var(--fd);letter-spacing:-.02em}
.bn-t small{font-size:12.5px;color:#b9bcd6;line-height:1.35}
.bn-b{margin-top:8px;padding:9px 15px;border-radius:var(--r-s);background:var(--acc);color:var(--ink);font-weight:800;font-size:13px}
.bn-b.off{background:#ffffff1c;color:var(--tx)}

/* ===== ЖИВАЯ ЛЕНТА ===== */
.feed{display:flex;align-items:center;gap:8px;margin:12px calc(var(--pad)*-1) 0;padding:0 var(--pad);overflow-x:auto;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.feed-l{flex:none;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--mu)}
.feed-l .dot{display:block;width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.fi{flex:none;display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:linear-gradient(180deg,#2a2d47,var(--c1));border:1px solid var(--bd);font-size:13px;white-space:nowrap}
.fi i{font-style:normal}.fi b{font-weight:800}.fi small{color:var(--mu);font-size:12px}
.fi.w i,.fi.w b{color:var(--ok)}.fi.l i,.fi.l b{color:var(--bad)}.fi.rec{border-color:#f5c54244}.fi.rec i,.fi.rec b{color:var(--gold)}

/* ===== КАРТОЧКИ ИГР (2 колонки) ===== */

/* ===== АПГРЕЙДЕР: акцент на звёздочки ===== */
.dcard{position:relative;overflow:hidden}
.dcard::before{content:"★";position:absolute;left:14px;top:10px;color:#f5c54255;font-size:18px;text-shadow:240px 40px 0 #f5c54233,26px 150px 0 #ffffff1f,260px 190px 0 #f5c54244}
.ctr::before{content:"★";margin-bottom:2px;color:var(--gold);font-size:20px;line-height:1;text-shadow:0 0 12px #f5c54299}
.chn::before{content:"★ ";color:var(--gold)}
.uar{font-size:0}.uar::before{content:"★";color:var(--gold);font-size:16px}
.xq button::before{content:"★";margin-right:4px;color:var(--gold);font-size:11px}.xq button.on::before{color:var(--ink)}

/* ===== КАРТОЧКИ ИГР v2: сцена на всю карточку, заголовок в нижнем блоке ===== */


/* ===== ШАПКА: одна цельная панель (логотип + баланс, ниже онлайн и кнопки) ===== */
.hd{position:relative;z-index:6;margin:0 calc(var(--pad)*-1);padding:10px var(--pad);background:linear-gradient(180deg,#1f2236,#1a1d2e 85%);border-bottom:1px solid #ffffff14;border-radius:0 0 22px 22px}
.hd-top{display:flex;align-items:center;gap:8px}
.hd-l{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.brand{overflow:hidden;line-height:1}
.wm{font-size:22px}
.pill{flex:none;display:flex;align-items:center;gap:8px;height:44px;padding:0 4px 0 12px;border-radius:22px;background:#1a1d2e;border:1px solid var(--bd2);box-shadow:inset 0 1px 0 #ffffff12}
.pill .st{color:var(--gold);font-size:17px;text-shadow:0 0 10px #f5c54288}
.pill #bal{min-width:0;font-size:16px;font-weight:800}
.plus{display:flex;align-items:center;gap:5px;height:36px;padding:0 14px 0 11px;border-radius:18px;background:var(--acc);color:var(--ink);font:800 13px var(--fb)}
.plus::before{content:"+";font-size:20px;font-weight:700;line-height:1;margin-top:-1px}

/* ===== НИЖНИЙ ДОК ===== */

 const d=document.createElement('div');d.style.cssText='position:fixed;left:8px;right:8px;top:70px;z-index:99;background:#fff;color:#000;padding:10px;border-radius:10px;font:11px/1.35 monospace;white-space:pre-wrap;word-break:break-all;max-height:70vh;overflow:auto';
 d.textContent='ДИАГНОСТИКА (сделайте скриншот)\n\n'+t;const b=document.createElement('button');b.textContent='закрыть';b.style.cssText='display:block;margin-top:8px;padding:6px 12px';b.onclick=()=>d.remove();d.appendChild(b);document.body.appendChild(d)}
async function api(p,b){try{const r=await fetch('/api/'+p,{method:'POST',headers:{'Content-Type':'application/json','X-Init':INIT(),'X-Test':S.t?'1':'0'},body:JSON.stringify(b||{})});const d=await r.json();if(d.error&&/нет данных входа/.test(d.error))showDiag();return d}catch(e){return{error:'Нет связи с сервером'}}}

 S.photo=d.photo||tgPhoto();Object.assign(S,{admin:!!d.admin,owner:!!d.owner,bal:d.balance,wag:d.wag,ups:d.ups,wins:d.wins,best:d.best,id:d.id,name:d.name,wl:d.wheel_left||0,wlT:Date.now(),wdl:d.wd_left});
 if(d.mines){game='mines';Object.assign(MN,{on:true,m:d.mines.m,bet:d.mines.bet,n:d.mines.open.length,mines:[],open:d.mines.open,last:-1,res:''})}
 {const ab=$('admb');if(ab)ab.style.display=S.admin?'':'none'}
 if(!S.admin)S.t=false;setOnl(d.online);setBal()}

<button class="go" onclick="doDeposit()">оплатить</button>`)}

async function doDeposit(){const amt=+$('dpa').value;toast('Создаю счёт…');const d=await api('deposit',{amount:amt});
 if(d.error)return say(d.error);

 if(!d.link){S.bal=d.balance;setBal();toast('Тест: +'+fmt(d.amount)+' ★');if(page=='profile')view();return}
 let got=0;const open2=()=>{try{tg().openTelegramLink(d.link);return 1}catch(e){}try{window.open(d.link,'_blank');return 1}catch(e){}return 0};
 try{tg().openInvoice(d.link,async st=>{got=1;if(st=='paid'){toast('Оплата прошла, зачисляем…');await wait(1500);await loadState();if(page=='profile')view()}else if(st=='failed')say('Оплата не прошла')})}
 catch(e){got=1;if(!open2())say('Не удалось открыть оплату. Ссылка: '+d.link)}
 setTimeout(()=>{if(got)return;try{tg().showConfirm('Окно оплаты не открылось? Открыть счёт по ссылке?',ok=>{if(ok&&!open2())say('Ссылка на оплату: '+d.link)})}catch(e){say('Если окно оплаты не открылось, откройте ссылку: '+d.link)}},3500)}

 <div class="mu" style="font-size:13px;line-height:1.5">Баланс <b class="gold">${fmt(u.balance)} ★</b> · оборот ${fmt(u.wag)} ★ · апгрейдов ${u.ups} · рекорд ${fmt(u.best)} ★</div>

 <div class="chips">${[100,1000,10000,-100].map(v=>`<button onclick="$('aam').value=${v}">${v>0?'+':'−'}${Math.abs(v)>=1000?Math.abs(v)/1000+'k':Math.abs(v)}</button>`).join('')}</div>

const u2chev='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11l5-5 5 5M7 18l5-5 5 5"/></svg>';
const fC=n=>n.toFixed(1).replace('.',','),xl=x=>x.toFixed(2).replace(/\.?0+$/,'').replace('.',',');
if(!document.getElementById('u2defs'))document.body.insertAdjacentHTML('beforeend','<svg id="u2defs" width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="u2sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#f0a928"/></linearGradient></defs></svg>');

function u2Dial(){const ch=E/X;let tk='';for(let i=0;i<60;i++){const r=i*6*Math.PI/180;tk+=`<line x1="${(150+136*Math.sin(r)).toFixed(2)}" y1="${(150-136*Math.cos(r)).toFixed(2)}" x2="${(150+141*Math.sin(r)).toFixed(2)}" y2="${(150-141*Math.cos(r)).toFixed(2)}"/>`}
return `<svg viewBox="0 0 300 300"><defs><radialGradient id="u2i" cx="50%" cy="38%" r="72%"><stop offset="0" stop-color="#2f2c7c"/><stop offset="1" stop-color="#151833"/></radialGradient><linearGradient id="u2pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3c4"/><stop offset="1" stop-color="#f3bd2f"/></linearGradient></defs>
<g stroke="#ffffff" stroke-opacity=".14" stroke-width="2" stroke-linecap="round">${tk}</g>
<circle cx="150" cy="150" r="${R}" fill="none" stroke="#2a2e54" stroke-width="18"/>
<circle id="u2arc" class="u2-arc" cx="150" cy="150" r="${R}" fill="none" stroke="#f6c945" stroke-width="18" transform="rotate(${90-ch*180} 150 150)" stroke-dasharray="${ch*CI} ${CI}"/>
<circle cx="150" cy="150" r="100" fill="url(#u2i)" stroke="#3b3f72" stroke-width="1.5"/>
<g id="ptr" style="transform-origin:150px 150px;transform:rotate(${ang}deg)"><path class="u2-pa" d="M137 12L150 46L163 12L150 22Z" fill="url(#u2pg)" stroke="#5b3f06" stroke-width="2" stroke-linejoin="round"/><g class="u2-pst"><g transform="translate(135 19) scale(1.25)"><path d="${U2ST}" fill="url(#u2sg)" stroke="#a8721a" stroke-width=".7" stroke-linejoin="round"/></g></g></g></svg>`}

let U2LV=[];
const u2fake=()=>{const xs=[1.2,1.3,1.5,1.7,2,2,2,3,5,8,11],bs=[1,2,5,10,25,50,100,250,500,1000],x=xs[Math.floor(rnd()*xs.length)],b=bs[Math.floor(rnd()*bs.length)];return{pay:Math.max(1,Math.floor(b*x)),x}};

function u2LiveR(){const e=$('u2lf');if(e)e.innerHTML=U2LV.slice(0,8).map(o=>`<div class="u2-lc${o.me?' me':''}">${u2star('u2-ls')}<span><b>${fmt(o.pay)} ★</b><small>×${xl(o.x)}</small></span></div>`).join('')}
function u2Live(o){U2LV.unshift(o);U2LV=U2LV.slice(0,14);u2LiveR()}
async function u2Poll(){if(page!='games'||game!='up'||document.hidden)return;const d=await api('live');if(d&&d.items){U2LV=d.items.slice(0,14);u2LiveR()}}
setInterval(u2Poll,5000);

vUp=function(){
 if(!(bet>=1)&&S.bal>=1)bet=Math.min(100,Math.floor(S.bal));
 ang=180;
 $('view').innerHTML=`${tabs('up')}<div class="u2" id="u2r">
 <div class="u2-live"><span class="u2-lv"><i></i>LIVE</span><div class="u2-lf" id="u2lf"></div></div>
 <div class="u2-top"><div class="u2-tg"><button class="u2-ib${FAST?' on':''}" id="u2fs" onclick="u2Fast()" aria-label="Быстрый режим"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg></button></div><div class="u2-tg"><button class="u2-ib" onclick="u2Info()" aria-label="Как это работает"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></button><button class="u2-ib" onclick="u2Fair()" aria-label="Честная игра"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg></button></div></div>
 <div class="u2-dial" id="u2d"><div class="u2-tk" id="u2tk"></div>${u2Dial()}<div class="u2-c">${u2star('u2-bs')}<b id="u2amt"></b></div></div>
 <div class="u2-ch" id="u2ch"><span id="u2cl">Шанс улучшения</span><b id="u2cv"></b></div>
 <div class="u2-cards"><button class="u2-cd u2-cb" onclick="betSheet()"><small>Ваша ставка</small><div class="u2-cr">${u2star('u2-cs')}<span><em>С баланса</em><b><i id="u2bet"></i> ★</b></span></div></button>
  <div class="u2-ar">→</div>
  <div class="u2-cd u2-cg"><small>Хочу получить</small><div class="u2-cr">${u2star('u2-cs')}<span><em id="u2gx"></em><b><i id="u2get"></i> ★</b></span></div></div></div>
 <div class="u2-qr">${[2,4,8].map(x=>`<button class="u2-q" data-x="${x}" onclick="setX(${x})">×${x}</button>`).join('')}<button class="u2-q u2-mx" onclick="u2Max()">MAX ставка</button></div>
 <div class="u2-sr"><span class="u2-pill" id="u2pl"></span><input class="u2-sl" id="u2sl" type="range" min="0" max="1000" step="1" aria-label="Множитель" oninput="setX(slX(+this.value),'sl')"></div>
 <div id="u2tl" hidden></div>
 <button class="u2-go" id="u2go" onclick="play()"></button></div>`;
 u2LiveR();u2Poll();setX(X);upd()};

upd=function(src){
 if(page!='games'||game!='up'||!$('u2arc'))return;
 const ch=E/X,pay=Math.floor(bet*X),arc=$('u2arc');
 arc.setAttribute('stroke-dasharray',`${ch*CI} ${CI}`);arc.setAttribute('transform',`rotate(${90-ch*180} 150 150)`);
 $('u2cv').textContent=fC(ch*100)+' %';$('u2amt').textContent=bet>=1?fmt(pay):'—';
 $('u2bet').textContent=bet>=1?fmt(bet):'выбрать';$('u2get').textContent=fmt(pay);$('u2gx').textContent='множитель ×'+xl(X);
 $('u2pl').innerHTML='×'+xl(X)+' '+u2star('u2-ps');
 const sl=$('u2sl');if(src!='sl')sl.value=xSl(X);sl.style.setProperty('--p',(xSl(X)/10)+'%');
 document.querySelectorAll('.u2-q[data-x]').forEach(b=>b.classList.toggle('on',+b.dataset.x==X));
 const tl=$('u2tl');let sel=null;
 tl.querySelectorAll('.u2-t').forEach(t=>{const x=+t.dataset.x,on=Math.abs(x-X)<.005;t.classList.toggle('on',on);t.querySelector('small').textContent=bet>=1?fmt(Math.floor(bet*x))+' ★':'';if(on)sel=t});
 if(sel&&src!='sl'&&src!='init')tl.scrollTo({left:sel.offsetLeft-tl.clientWidth/2+sel.offsetWidth/2,behavior:'smooth'});
 goBtn()};

goBtn=function(){const g=$('u2go');if(!g)return;const low=bet>S.bal;g.disabled=busy||!(bet>=1)||low;
 g.innerHTML=busy?'<span class="u2-sp"></span>Улучшаем…':low?'Недостаточно звёзд':!(bet>=1)?'Выберите ставку':u2chev+'Улучшить';
 const r=$('u2r');if(r)r.classList.toggle('lock',!!busy)};
ctr=function(){};

function u2Idle(){const d=$('u2d'),c=$('u2ch');if(d)d.classList.remove('ok','bad');if(c){c.classList.remove('win','lose')}const l=$('u2cl');if(l)l.textContent='Шанс улучшения'}
function u2Rand(){if(busy)return;u2Idle();const lo=Math.max(UPMINX,2),hi=Math.min(UPMAX,30);setX(Math.round(lo*Math.pow(hi/lo,rnd())*100)/100)}
function u2Max(){if(busy)return;u2Idle();setBet(maxBet())}
function u2Info(){shOpen(`<h2 style="margin-top:0">Как это работает</h2><div class="mu" style="line-height:1.6;font-size:14px">• Выберите ставку и множитель: чем он выше, тем меньше шанс.<br>• Выплата = ставка × множитель.<br>• Победа, если стрелка остановится в золотой зоне.<br>• Результат считается на сервере, подменить его нельзя.</div>`)}

play=async function(){
 if(busy||!(bet>=1)||bet>S.bal)return;
 u2Idle();busy=true;const b=bet,x=X,ch=E/x;goBtn();
 const d=await api('up',{bet:b,x:x});
 if(d.error){busy=false;toast(d.error);upd();return}
 S.bal-=b;S.wag+=b;S.ups++;setBal();
 const r=d.r,win=d.win,p=$('ptr');
 if(p){const a0=ang;ang=(Math.floor(ang/360)+6)*360+180+(r-ch/2)*360;spinTo(p,a0,ang)}
 await wait(Math.round(SD()*1000)+450);
 try{hapN(win?'success':'error');SFX.res(win)}catch(e){}
 const pay=d.pay;if(win){S.wins++;S.best=Math.max(S.best,pay)}
 S.bal=d.balance;S.hist.unshift({b,x,win,pay,r:r*100,t:Date.now()});S.hist=S.hist.slice(0,40);setBal();
 u2Live({pay:win?pay:b,x,me:1,lose:!win});
 busy=false;
 if(page=='games'&&game=='up'&&$('u2d')){
  $('u2d').classList.add(win?'ok':'bad');$('u2ch').classList.add(win?'win':'lose');$('u2cl').textContent=win?'Улучшено!':'Не повезло';
  goBtn();if(win)confetti(pay>=b*5?60:28);
  await wait(700);if(page=='games'&&game=='up'&&!busy)u2Modal(win,b,x,pay)}
};

function u2Modal(w,b,x,pay){u2Close();const m=document.createElement('div');m.className='u2-m';m.id='u2m';
 m.onclick=e=>{if(e.target==m)u2Close()};
 m.innerHTML=`<div class="u2-mc ${w?'w':'l'}"><button class="u2-mxb" onclick="u2Close()" aria-label="Закрыть">✕</button>
 <div class="u2-mh">${w?`<span>${x>=5?'КРУПНЫЙ ВЫИГРЫШ':'ПОБЕДА'}</span><em>×${xl(x)}</em>`:'<span>РАУНД ЗАВЕРШЁН</span>'}</div>
 <h3>${w?'Улучшено':'Не повезло'}</h3>
 <div class="u2-mt">${u2star('u2-mbs',w?'':'filter:grayscale(1) brightness(.6)')}</div>
 <div class="u2-mv">${w?'+'+fmt(pay):'−'+fmt(b)} <i>★</i></div>
 <div class="u2-ms">ставка ${fmt(b)} ★ · множитель ×${xl(x)} · шанс ${fC(E/x*100)} %</div>
 <div class="u2-mb"><button class="u2-mgo" onclick="u2Next(${w?pay:b})">${u2chev}${w?'Улучшить':'Ещё раз'}</button>${w?`<button class="u2-msec" onclick="u2Take(${pay})">Забрать ${fmt(pay)} ★</button>`:`<button class="u2-msec" onclick="u2Close()">Закрыть</button>`}</div></div>`;
 document.body.appendChild(m)}
function u2Take(v){u2Close();const t=$('u2tk');if(t){t.textContent='Забрано · '+fmt(v)+' ★';t.classList.add('show');clearTimeout(window.__u2t);window.__u2t=setTimeout(()=>t.classList.remove('show'),2600)}}
function u2Fast(){toggleFast();const b=$('u2fs');if(b)b.classList.toggle('on',!!window.FAST)}
function u2Fair(){shOpen(`<h2 style="margin-top:0">Честная игра</h2><div class="mu" style="line-height:1.6;font-size:14px">• Шанс = 90% ÷ множитель.<br>• Результат определяется сразу при нажатии, анимация на него не влияет.<br>• Выплата = ставка × множитель, зачисляется на баланс автоматически.</div>`)}
function u2Close(){const m=$('u2m');if(m)m.remove()}
function u2Next(v){u2Close();u2Idle();if(busy)return;setBet(Math.min(Math.floor(v),maxBet()));upd()}
</script>
</body></html>
